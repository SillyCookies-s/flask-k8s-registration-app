apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: {{ .Values.frontend.image }}
          ports:
            - containerPort: 5000
              protocol: TCP
          env:
            - name: BACKEND_URL
              value: http://backend.{{ .Values.namespace }}.svc.cluster.local:3000 || http://localhost:3000
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector:
    app: frontend
  type: {{ .Values.frontend.serviceType }}
  ports:
    - port: {{ .Values.frontend.servicePort }}
      targetPort: 5000
      protocol: TCP