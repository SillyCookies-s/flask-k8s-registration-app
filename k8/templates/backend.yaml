apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: {{ .Values.backend.image }}
          ports:
            - containerPort: 3000
              protocol: TCP
          env:
            - name: MONGO_URL
              value: {{ .Values.backend.mongoURL}}

---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  type: {{ .Values.backend.serviceType }}
  ports:
    - port: {{ .Values.backend.servicePort }}
      targetPort: 3000
      protocol: TCP